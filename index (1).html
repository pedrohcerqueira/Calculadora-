<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style..css">
  <title>Calculadora</title>
</head>

<body>

  <main class="calc">

    <div class="screen">
      <div id="expr"></div>
      <div id="cur">0</div>
    </div>

    <div class="keys">

      <button data-a="ac">AC</button>
      <button data-a="del">⌫</button>
      <button data-a="pct">%</button>
      <button data-o="/">÷</button>

      <button data-n="7">7</button>
      <button data-n="8">8</button>
      <button data-n="9">9</button>
      <button data-o="*">×</button>

      <button data-n="4">4</button>
      <button data-n="5">5</button>
      <button data-n="6">6</button>
      <button data-o="-">−</button>

      <button data-n="1">1</button>
      <button data-n="2">2</button>
      <button data-n="3">3</button>
      <button data-o="+">+</button>

      <button data-a="sign">+/-</button>
      <button data-n="0">0</button>
      <button data-a="decimal">.</button>
      <button data-a="equals">=</button>

    </div>

  </main>

  <script src="function.js"></script>

</body>
</html>
